name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Full workspace build + test on Linux.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # Strict lint gate. Scoped to the non-GUI crates: iced_ui is being replaced,
  # so gating its warnings is wasted effort. Add crates here as they are cleaned.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (non-GUI crates, deny warnings)
        # Bug-catching lints (dead_code, unused, correctness, suspicious, perf)
        # are enforced. A curated set of low-value style lints is allowed
        # project-wide — these are near-universally allow-listed in production
        # Rust and their sites are stable domain code. Do not grow this list to
        # silence real findings.
        run: >
          cargo clippy
          -p types -p deps -p data_stores -p secrets_store
          -p ledger_connector -p icon_provider -p app_path -p wallet
          --all-targets --
          -D warnings
          -A clippy::type_complexity
          -A clippy::too_many_arguments
          -A clippy::result_large_err
          -A clippy::redundant_static_lifetimes
          -A clippy::borrowed_box
          -A clippy::to_string_trait_impl
          -A clippy::partialeq_ne_impl
          -A clippy::non_canonical_partial_ord_impl
          -A clippy::match_like_matches_macro
          -A clippy::manual_try_fold

  # Supply-chain gate. licenses is intentionally omitted; see deny.toml.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans sources advisories

  # The OS credential store has a Windows-only code path that was previously
  # untested. Exercise it on a real Windows runner.
  windows-secrets:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build + test secrets store on Windows
        run: cargo test -p secrets_store -p types
