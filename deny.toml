# cargo-deny configuration. See .ai_docs/hardening_and_architecture_plan.md Phase 0.
# Run: cargo deny check

[bans]
# Bare "*" version requirements defeat reproducible builds. Path deps (our own
# workspace crates) are not real wildcards.
wildcards = "deny"
allow-wildcard-paths = true
# The dependency tree still pulls several duplicate transitive versions; tighten
# to "deny" once deduplicated.
multiple-versions = "warn"

[advisories]
# Fail on known-vulnerable or yanked crates. This is the main security value of
# cargo-deny for a wallet.
yanked = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Author-maintained forks used by the workspace.
allow-git = [
    "https://github.com/aleanon/hot_ice.git",
    "https://github.com/aleanon/radix-gateway-sdk-fork.git",
    "https://github.com/aleanon/encrypt.git",
]

# NOTE: `cargo deny check licenses` currently fails because the Radix official
# crates (scrypto, sbor, radix-*) and the hot_ice fork ship non-SPDX license
# metadata that cargo-deny reads as "unlicensed". CI therefore enforces
# `bans sources advisories` only. Revisit licenses with per-crate `clarify`
# entries once the Radix crate licensing is confirmed; the allow-list below is
# already correct for everything that does declare an SPDX license.
[licenses]
# Permissive licenses compatible with this project. Add identifiers as the
# dependency tree surfaces them rather than disabling the check.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
]
confidence-threshold = 0.9

# Our own workspace crates are publish = false and carry no license field.
[licenses.private]
ignore = true
