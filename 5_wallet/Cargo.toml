
[package]
name = "wallet"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
deps = { path = "../0_deps" }
types = { path = "../1_types" }
data_stores = { path = "../01_ports_and_adapters/data_stores" }
ledger_connector = { path = "../01_ports_and_adapters/ledger_connector" }
secrets_store = { path = "../01_ports_and_adapters/secrets_store" }
icon_provider = { path = "../01_ports_and_adapters/icon_provider" }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# bytes = { workspace = true }
# tokio = { workspace = true }
# debug_print = { workspace = true }

[dev-dependencies]
# Enable the in-memory test doubles (FakeGateway, InMemorySecretsStore) + temp-dir sandbox for
# the headless end-to-end login→send integration test.
ledger_connector = { path = "../01_ports_and_adapters/ledger_connector", features = ["testing"] }
secrets_store = { path = "../01_ports_and_adapters/secrets_store", features = ["testing"] }
data_stores = { path = "../01_ports_and_adapters/data_stores" }
types = { path = "../1_types" }
deps = { path = "../0_deps" }
tempfile = "3"
